<!DOCTYPE html>
<html lang="en">
  <head>
    <title>SPMD Playground</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self' blob:; connect-src 'self';"/>
    <link rel="stylesheet" href="resources/bootstrap-5.3.3.min.css">
    <link rel="stylesheet" href="dashboard.css"/>
    <link rel="icon" type="image/png" href="resources/favicon-32x32.png" sizes="32x32"/>
    <script type="module" src="dashboard.js"></script>
    <script src="resources/bootstrap-5.3.3.bundle.min.js" defer></script>
    <link rel="modulepreload" href="resources/editor.bundle.min.js"/>
  </head>
  <body>
    <header id="topbar">
      <h1>SPMD Playground</h1>
      <div id="example-picker" class="btn-group">
        <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          <span id="example-label">Loading…</span>
        </button>
        <div id="example-menu" class="dropdown-menu"></div>
      </div>
      <label class="simd-toggle">
        <input type="checkbox" id="simd-toggle" checked/>
        <span>SIMD</span>
      </label>
      <button type="button" id="run-button" class="btn btn-success">▶ Run</button>
    </header>
    <main id="middle">
      <div id="editor" role="textbox" aria-label="Go source editor"></div>
      <div id="right-pane">
        <div id="tabbar" role="tablist">
          <button type="button" class="tab active" id="tab-run" role="tab" aria-selected="true" data-tab="run">Run</button>
          <button type="button" class="tab" id="tab-wat" role="tab" aria-selected="false" data-tab="wat">WAT</button>
          <button type="button" class="tab" id="tab-asm" role="tab" aria-selected="false" data-tab="asm">AVX2</button>
        </div>
        <pre id="output-pane" role="tabpanel" aria-labelledby="tab-run"><code id="output-code"></code></pre>
        <div id="hint"></div>
      </div>
    </main>
  </body>
</html>
