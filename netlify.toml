# Netlify configuration for the SPMD playground static frontend.
#
# Deployment model: Model B (split static / API).
#   - Netlify serves the static assets (index.html, dashboard.{js,css},
#     highlight-*.js, resources/, worker/, examples/).
#   - The SPMD compiler backend runs on Cloud Run and is reverse-proxied at
#     /api/*. This mirrors the upstream play.tinygo.org deployment shape, keeps
#     the static layer cheap, and lets the heavy Cloud Run instance scale
#     independently.
#
# Public site: https://gofor-tinygo.netlify.app (default Netlify subdomain).
# The custom domain spmd.ddlm.me is intentionally not configured; it can be
# added later with zero downtime if a branded URL is wanted. The /api/* rule
# below is a same-origin rewrite, so the site works identically on either host.
#
# Cloud Run backend: reached via the Cloud Armor-protected load balancer at
# https://spmd-api.ddlm.me (set in the redirect below). Cloud Run ingress is
# locked to load-balancer-only, so the raw run.app URL is not reachable.

[build]
  publish = "."
  command = "npm install && make resources/editor.bundle.min.js"

# Reverse-proxy the compile API to Cloud Run. status=200 + force=true makes
# Netlify rewrite (not redirect) so the browser sees a same-origin response,
# which keeps COOP/COEP and CORS straightforward.
[[redirects]]
  from = "/api/*"
  to = "https://spmd-api.ddlm.me/api/:splat"
  status = 200
  force = true

# COOP/COEP are required for SharedArrayBuffer / cross-origin isolation used by
# the in-browser wasm runner.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

# Cache static assets for a day. We deliberately avoid `immutable` and a year-
# long max-age because the filenames are not content-hashed: runner.js,
# editor.bundle.min.js etc. keep their names across deploys, so an aggressive
# immutable policy would freeze stale code on user browsers. A 1-day window
# gives the CDN room to serve without making bug-fix deploys take a year to
# reach users.
[[headers]]
  for = "/resources/editor.bundle.min.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/worker/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
